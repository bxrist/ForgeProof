name: Seed Commit URL Health Check

on:
  schedule:
    # Run daily at 08:00 UTC
    - cron: "0 8 * * *"
  push:
    branches:
      - main
    paths:
      - "server/seed.ts"
      - "scripts/check-commit-urls.mjs"
  workflow_dispatch:

jobs:
  check-commit-urls:
    name: Verify seed gitCommitUrls are reachable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run commit URL health check
        run: node scripts/check-commit-urls.mjs
