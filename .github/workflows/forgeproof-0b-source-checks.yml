name: ForgeProof 0B source checks

on:
  pull_request:
    branches:
      - ForgeProof
      - feat/milestone-0b-git-authoritative-store-20261107

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify lockfile uses public npm registry tarballs only
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock && typeof lock === 'object' ? lock.packages : null;

          if (!packages || typeof packages !== 'object') {
            console.error('Invalid package-lock.json format');
            process.exit(1);
          }

          for (const value of Object.values(packages)) {
            if (!value || typeof value !== 'object') continue;
            const resolved = value.resolved;
            if (typeof resolved !== 'string' || resolved.length === 0) continue;

            let url;
            try {
              url = new URL(resolved);
            } catch {
              console.error('Invalid package-lock.json resolved URL');
              process.exit(1);
            }

            if (url.protocol !== 'https:' || url.hostname !== 'registry.npmjs.org') {
              console.error('Found non-compliant tarball URL(s) in package-lock.json');
              process.exit(1);
            }
          }
          NODE
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --import tsx --test tests/*.test.mjs
