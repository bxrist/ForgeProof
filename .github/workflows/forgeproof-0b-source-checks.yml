name: ForgeProof 0B source checks

on:
  pull_request:
    branches:
      - ForgeProof
      - feat/milestone-0b-git-authoritative-store-20261107

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node --import tsx --test tests/*.test.mjs
